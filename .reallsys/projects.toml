# GitHub repo -> 內網 GitLab 專案 對照表。
#
# Codex 會讀這個檔:依「當前事件的來源 GitHub repo」查出要鏡像/操作的內網 GitLab 專案,
# 以及該鏡像 MR 的目標分支。佈署時會複製到 Codex 的工作目錄,和 AGENTS.md 同一層:
#   Docker: /app/workspace/projects.toml
#   deb:    /var/lib/ci-webhook-codex-agent/projects.toml
#
# 解析規則(Codex 遵循):
#   1. 找 github 等於來源 repo 的項目,用它的 gitlab 當內網專案路徑。
#   2. 找不到就用 default_host + 相同的 <owner>/<repo>。
#   3. 內網 git 網址一律 = <default_host>/<gitlab 路徑>.git
#   4. 鏡像 MR 的目標分支 = 該項目的 target_branch,沒寫就用 default_target_branch。

# 預設內網 GitLab host。
default_host = "https://git.reall.us"

# 鏡像 MR 的預設目標分支(個別項目可用 target_branch 覆蓋)。
default_target_branch = "main"

# 個別對照:可列多個 [[projects]]。只有當內網路徑與 GitHub 的 <owner>/<repo> 不同、
# 或該 repo 的目標分支不是 default_target_branch 時,才需要列。
#   github        = "<owner>/<repo>"   GitHub 來源 repo
#   gitlab        = "<group>/<proj>"   對應的內網 GitLab 專案路徑
#   target_branch = "<branch>"         (選填)鏡像 MR 的目標分支,覆蓋 default_target_branch
[[projects]]
github = "telegram-sms/telegram-sms"
gitlab = "telegram-sms/telegram-sms"

[[projects]]
github = "example/web"
gitlab = "team/web-mirror"
target_branch = "release"
