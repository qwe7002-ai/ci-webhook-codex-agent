# nfpm packaging config for the .deb. ARCH and VERSION are supplied via the
# environment by the release workflow (built once per architecture).
name: "ci-webhook-codex-agent"
arch: "${ARCH}"
version: "${VERSION}"
version_schema: none
maintainer: "qwe7002-ai <qwe7002.ai@gmail.com>"
description: |
  GitHub webhook -> Codex -> GitLab agent.
  Receives GitHub webhooks, runs Codex (via MCP) to triage events and open
  GitLab issues, and to review/mirror/merge pull requests as GitLab MRs.
homepage: "https://github.com/qwe7002-ai/ci-webhook-codex-agent"
license: "BSD-3-Clause"
section: "utils"
priority: "optional"

# git is used by the PR mirror flow. codex / glab / gh are not in Debian repos,
# so they are documented as external prerequisites rather than hard deps.
recommends:
  - git

contents:
  # Built per-architecture to this fixed path just before packaging.
  - src: ./dist/ci-webhook-codex-agent
    dst: /usr/bin/ci-webhook-codex-agent
    file_info:
      mode: 0755

  # Codex skill: helper on PATH. The operating guide (AGENTS.md) is compiled into
  # the server binary and passed as the MCP system instructions, so it is not
  # installed into the working directory.
  - src: ./codex/bin/gh-pr-mirror.sh
    dst: /usr/bin/gh-pr-mirror.sh
    file_info:
      mode: 0755
  # GitHub -> GitLab project map Codex reads to resolve the target project.
  - src: ./.reallsys/projects.toml
    dst: /var/lib/ci-webhook-codex-agent/projects.toml
    type: "config|noreplace"

  # systemd unit.
  - src: ./packaging/systemd/ci-webhook-codex-agent.service
    dst: /lib/systemd/system/ci-webhook-codex-agent.service

  # Config + secrets env file, both preserved across upgrades.
  - src: ./packaging/config.yaml
    dst: /etc/ci-webhook-codex-agent/config.yaml
    type: "config|noreplace"
  - src: ./packaging/agent.env
    dst: /etc/ci-webhook-codex-agent/agent.env
    type: "config|noreplace"
    file_info:
      mode: 0640

scripts:
  postinstall: ./packaging/scripts/postinstall.sh
  preremove: ./packaging/scripts/preremove.sh
  postremove: ./packaging/scripts/postremove.sh
