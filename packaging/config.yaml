# ci-webhook-codex-agent configuration (Debian package default).
# Installed to /etc/ci-webhook-codex-agent/config.yaml (config|noreplace: your
# edits survive upgrades). ${VAR} is expanded from the environment at load time;
# secrets live in /etc/ci-webhook-codex-agent/agent.env (loaded by the systemd
# unit), not in this file.

server:
  addr: ":8080"        # listen address
  path: "/webhook"     # GitHub webhook target path

github:
  # Shared secret used to verify X-Hub-Signature-256. Optional: if empty (the
  # ${GITHUB_WEBHOOK_SECRET} env var is unset), the agent generates one on first
  # run and persists it at <codex.workdir>/.webhook-secret. Register the GitHub
  # webhook with the same secret via:
  #   ci-webhook-codex-agent -setup-webhook -repo <owner/repo> -webhook-url <url>
  webhook_secret: "${GITHUB_WEBHOOK_SECRET}"

  # gh/glab authenticate themselves: run `gh auth login` and `glab auth login`
  # as the service user (HOME=/var/lib/ci-webhook-codex-agent) once, and Codex
  # reuses those credentials. No GitHub/GitLab token lives in this config.

  # Which events to act on. The key is the GitHub event name (X-GitHub-Event).
  # Any event not listed, or with enabled:false, is ignored.
  events:
    issues:
      enabled: true
      actions: ["opened", "reopened"]   # empty = any action

    # PR monitoring: review each PR (gh, comment mode) and mirror it to a GitLab
    # MR on opened/reopened; on closed+merged, merge the mirrored MR. See `pr:`.
    pull_request:
      enabled: true
      actions: ["opened", "reopened", "closed"]   # "closed" drives merge-sync (only acts when merged)

    push:
      enabled: false

    # CI failures -> the core "ci-webhook" use case. Only failing runs qualify.
    workflow_run:
      enabled: true
      actions: ["completed"]
      conclusions: ["failure", "timed_out", "cancelled"]   # empty = any conclusion

    check_run:
      enabled: false
      actions: ["completed"]
      conclusions: ["failure", "timed_out"]

codex:
  bin: "codex"
  model: "gpt-5-codex"     # optional; injected as the "model" tool argument. Empty = codex default.
  # Working dir for the codex mcp process = the service state dir (also HOME).
  # The operating guide (AGENTS.md) is compiled into the server and passed as the
  # system_key argument below, so it need NOT live here; Codex reads projects.toml
  # from this dir at runtime (the package installs it at
  # /var/lib/ci-webhook-codex-agent/projects.toml).
  workdir: "/var/lib/ci-webhook-codex-agent"
  timeout: "5m"
  # Codex runs as an MCP server; this agent is the MCP client (stdio JSON-RPC).
  mcp:
    args: ["mcp"]          # how to launch codex as an MCP server over stdio
    tool_name: "codex"     # the tool this agent calls
    prompt_key: "prompt"   # tool argument the rendered prompt goes into
    # Tool argument the embedded AGENTS.md is passed in as. "developer-instructions"
    # layers it on as a developer-role message (over Codex's own base instructions);
    # "base-instructions" would replace them instead. Version-dependent name; empty
    # disables and falls back to Codex reading AGENTS.md from the working dir.
    system_key: "developer-instructions"
    # Static tool-call arguments merged into every call. sandbox/approval let
    # Codex run glab (needs shell + network to the internal GitLab). Tighten to
    # taste; see README "Security". Argument names track your codex version's
    # tool schema — adjust here rather than in code if they differ.
    arguments:
      sandbox: "danger-full-access"
      approval-policy: "never"

gitlab:
  host: "${GITLAB_HOST}"      # internal GitLab base URL, e.g. https://gitlab.internal.corp
                              # (points glab at the right instance; auth comes from `glab auth login`)
  project: "team/incidents"   # target project path where triage issues are opened

# PR playbooks (used when pull_request is enabled).
pr:
  review_mode: "comment"                                   # gh review mode; comment = no approve/block
  gitlab_project: "team/web-mirror"                        # GitLab project for mirrored MRs
  gitlab_repo_url: "https://gitlab.internal.corp/team/web-mirror.git"  # git push target (no creds; glab's credential helper authenticates the push)
  target_branch: "main"                                    # base branch for mirrored MRs / merge sync

worker:
  concurrency: 2     # parallel Codex runs
  queue_size: 100    # bounded backlog; excess deliveries get 503 (GitHub retries)
